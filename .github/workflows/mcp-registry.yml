# Publishes Froxel's MCP server when a release is published (the draft that
# release.yml makes, once it is made public). The image is the Dockerfile, which
# downloads that release's Linux build and runs `froxel mcp` over stdio; the
# MCP Registry entry is server.json, which names the image. Pre-releases are
# skipped. Rerun it from the Actions tab with a tag to publish one by hand.
name: MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.3.3"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/theromis/froxel-mcp
  MCP_PUBLISHER_VERSION: v1.8.10
  # sha256 of mcp-publisher_linux_amd64.tar.gz, from that release's
  # registry_<version>_checksums.txt. Change both together.
  MCP_PUBLISHER_SHA256: 32d287ed6fb7dc04eddd2621097784c06a355b2348b35ccc630a1643aa75ff4a

jobs:
  image:
    name: Container image
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not v<semver>"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ steps.version.outputs.version }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: FROXEL_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          push: true
      # The image answers initialize on stdin, as a registry client would
      # start it.
      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          reply="$(printf '%s\n' "$request" | timeout 60 docker run -i --rm "$IMAGE:$VERSION" | head -n 1)"
          echo "$reply"
          grep -q '"serverInfo"' <<<"$reply"

  registry:
    name: MCP Registry
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.image.outputs.version }}
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          name=mcp-publisher_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/$name"
          echo "$MCP_PUBLISHER_SHA256  $name" | sha256sum -c -
          tar -xzf "$name" mcp-publisher
          ./mcp-publisher --help >/dev/null
      # server.json is kept at the Cargo.toml version by
      # tools/sync_versions.py; the tag wins here, so a re-run of an older
      # tag publishes that tag's image.
      - name: Point server.json at this release
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" --arg image "$IMAGE:$VERSION" '
            .version = $v
            | .packages |= map(if .registryType == "oci" then .identifier = $image else . end)
          ' server.json >server.json.new
          mv server.json.new server.json
          cat server.json
          ./mcp-publisher validate server.json
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish server.json
