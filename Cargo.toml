[package]
name = "froxel"
version = "0.2.0"
edition = "2021"
publish = false
# tests/*.rs are unit tests included with #[path], not integration tests.
autotests = false
description = "Froxel voxel editor."

[dependencies]
same-file = "1.0.6"
egui = "0.37"
getrandom = "0.3"
glam = "0.29"
bytemuck = { version = "1.7", features = ["derive"] }
png = "0.18"
serde_json = "1"
rhai = "1.27.0"
oidn = { version = "2", optional = true }

# Desktop: eframe's defaults and native file dialogs.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
eframe = { version = "0.37", features = ["wgpu"] }
rfd = "0.15"

# Phones and tablets: no clipboard, X11, or Wayland, which do not build there.
# accesskit on Android requires the game-activity backend; this app uses native-activity.
[target.'cfg(target_os = "ios")'.dependencies]
log = "0.4"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
winit = { version = "0.30.13", default-features = false }
android-activity = { version = "0.6.1", features = ["native-activity"] }
jni = "0.22.4"

[features]
oidn = ["dep:oidn"]
# Selects the Android cdylib (`src/lib.rs`). Desktop builds leave it off so
# `cargo build` / `cargo test --bin froxel` stay the host binary.
android-lib = []

[lib]
name = "froxel"
path = "src/lib.rs"
crate-type = ["cdylib"]
required-features = ["android-lib"]

# `cargo apk build --lib --features android-lib --release` for the APK, then
# `packaging/android/bundle.sh` for the Play App Bundle.
[package.metadata.android]
package = "com.lonje.froxel"
apk_name = "froxel"
build_targets = ["aarch64-linux-android"]
resources = "packaging/android/res"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 36

[package.metadata.android.application]
label = "Froxel"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
extract_native_libs = true

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density|uiMode"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }

# Embeds packaging/icons/froxel.ico in froxel.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# iOS surface size fix; see vendor/README.md.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }
